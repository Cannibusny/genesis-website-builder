<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GENESIS Website Builder</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #11141b;
    --panel-2: #161a23;
    --border: #1f2430;
    --text: #e8ecf3;
    --muted: #8a92a6;
    --accent: #7c5cff;
    --accent-2: #22d3ee;
    --danger: #ef4444;
    --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(1200px 600px at 80% -10%, rgba(124,92,255,0.12), transparent 60%),
                radial-gradient(900px 500px at -10% 110%, rgba(34,211,238,0.10), transparent 60%),
                var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(11,13,18,0.6);
    backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 700;
    letter-spacing: 0.4px;
  }
  .brand .logo {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 8px 24px rgba(124,92,255,0.35);
  }
  .brand .name { font-size: 14px; text-transform: uppercase; }
  .brand .name span { color: var(--accent-2); }
  .health {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--muted); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 12px var(--ok); }
  .dot.err { background: var(--danger); box-shadow: 0 0 12px var(--danger); }

  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 32px 24px 64px;
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 24px;
  }
  @media (max-width: 960px) {
    main { grid-template-columns: 1fr; }
  }

  .panel {
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  }
  .panel h2 {
    margin: 0;
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
  }
  form { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
  input, textarea, select {
    width: 100%;
    background: #0d1018;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    font-family: inherit;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,92,255,0.18);
  }
  textarea { min-height: 110px; resize: vertical; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 6px; }

  button.primary {
    appearance: none;
    border: 0;
    cursor: pointer;
    color: white;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.3px;
    padding: 12px 16px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 30px rgba(124,92,255,0.35);
    transition: transform 0.05s ease, opacity 0.15s ease;
  }
  button.primary:hover { transform: translateY(-1px); }
  button.primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .actions { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .hint { font-size: 12px; color: var(--muted); }

  .preview-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .preview-head .title { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .preview-head .controls { display: flex; gap: 8px; }
  .ctl {
    appearance: none;
    border: 1px solid var(--border);
    background: #0d1018;
    color: var(--text);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .ctl:hover { border-color: var(--accent); }
  .preview-body {
    height: calc(100vh - 280px);
    min-height: 520px;
    background: #0a0c12;
    border-bottom-left-radius: 16px;
    border-bottom-right-radius: 16px;
    overflow: hidden;
    position: relative;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    background: white;
  }
  .placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; text-align: center; padding: 24px;
  }
  .placeholder .pad {
    max-width: 380px;
    border: 1px dashed var(--border);
    padding: 24px;
    border-radius: 12px;
    background: rgba(255,255,255,0.02);
  }
  .loading {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(10,12,18,0.6);
    backdrop-filter: blur(2px);
    z-index: 2;
    color: var(--text);
    font-size: 14px;
  }
  .loading.show { display: flex; }
  .spinner {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: var(--accent-2);
    animation: spin 0.8s linear infinite;
    margin-right: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error {
    margin: 0 20px 20px;
    padding: 12px 14px;
    background: rgba(239,68,68,0.08);
    border: 1px solid rgba(239,68,68,0.35);
    color: #fecaca;
    border-radius: 10px;
    font-size: 13px;
    display: none;
  }
  .error.show { display: block; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"></div>
    <div class="name">GENESIS<span>·</span>Website Builder</div>
  </div>
  <div class="health" id="health">
    <span class="dot" id="healthDot"></span>
    <span id="healthLabel">checking…</span>
  </div>
</header>

<main>
  <section class="panel">
    <h2>Business Details</h2>
    <form id="builderForm">
      <div class="field">
        <label for="businessName">Business Name</label>
        <input id="businessName" name="businessName" placeholder="e.g. Aurora Coffee Co." required />
      </div>
      <div class="row">
        <div class="field">
          <label for="businessType">Type</label>
          <input id="businessType" name="businessType" placeholder="e.g. Cafe & Roastery" required />
        </div>
        <div class="field">
          <label for="location">Location</label>
          <input id="location" name="location" placeholder="e.g. Brooklyn, NY" required />
        </div>
      </div>
      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" name="description" placeholder="What makes the business unique? Audience, vibe, signature offerings…" required></textarea>
      </div>
      <div id="error" class="error"></div>
      <div class="actions">
        <span class="hint">Powered by Claude · Sonnet 4.5</span>
        <button id="generateBtn" type="submit" class="primary">Generate Website</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <div class="preview-head">
      <div class="title">Live Preview</div>
      <div class="controls">
        <button class="ctl" id="downloadBtn" type="button" disabled>Download HTML</button>
        <button class="ctl" id="openTabBtn" type="button" disabled>Open in New Tab</button>
      </div>
    </div>
    <div class="preview-body">
      <div class="loading" id="loading"><div class="spinner"></div>Generating your website…</div>
      <div class="placeholder" id="placeholder">
        <div class="pad">
          Fill out your business details on the left and click <strong>Generate Website</strong>.
          A live preview will appear here.
        </div>
      </div>
      <iframe id="preview" title="Generated website preview" style="display:none"></iframe>
    </div>
  </section>
</main>

<script>
  const form = document.getElementById('builderForm');
  const generateBtn = document.getElementById('generateBtn');
  const preview = document.getElementById('preview');
  const placeholder = document.getElementById('placeholder');
  const loading = document.getElementById('loading');
  const errorEl = document.getElementById('error');
  const downloadBtn = document.getElementById('downloadBtn');
  const openTabBtn = document.getElementById('openTabBtn');
  const healthDot = document.getElementById('healthDot');
  const healthLabel = document.getElementById('healthLabel');

  let lastHtml = '';

  async function checkHealth() {
    try {
      const res = await fetch('/health');
      if (res.ok) {
        healthDot.classList.add('ok');
        healthLabel.textContent = 'online';
      } else {
        healthDot.classList.add('err');
        healthLabel.textContent = 'degraded';
      }
    } catch {
      healthDot.classList.add('err');
      healthLabel.textContent = 'offline';
    }
  }
  checkHealth();

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.add('show');
  }
  function clearError() {
    errorEl.textContent = '';
    errorEl.classList.remove('show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();

    const payload = {
      businessName: document.getElementById('businessName').value.trim(),
      businessType: document.getElementById('businessType').value.trim(),
      location: document.getElementById('location').value.trim(),
      description: document.getElementById('description').value.trim(),
    };

    generateBtn.disabled = true;
    loading.classList.add('show');

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error || 'Generation failed');

      lastHtml = data.html || '';
      if (!lastHtml) throw new Error('Empty response from model');

      placeholder.style.display = 'none';
      preview.style.display = 'block';
      preview.srcdoc = lastHtml;

      downloadBtn.disabled = false;
      openTabBtn.disabled = false;
    } catch (err) {
      showError(err.message || 'Something went wrong');
    } finally {
      loading.classList.remove('show');
      generateBtn.disabled = false;
    }
  });

  downloadBtn.addEventListener('click', () => {
    if (!lastHtml) return;
    const blob = new Blob([lastHtml], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'website.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  openTabBtn.addEventListener('click', () => {
    if (!lastHtml) return;
    const blob = new Blob([lastHtml], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  });
</script>
</body>
</html>
