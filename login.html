<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GENESIS Website Builder · Sign in</title>
    <meta name="description" content="Restricted access to the GENESIS Website Builder." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #06060c;
        --panel: rgba(20, 20, 32, 0.78);
        --border: rgba(255, 255, 255, 0.08);
        --text: #e8e8f5;
        --muted: rgba(232, 232, 245, 0.62);
        --accent-1: #7c5cff;
        --accent-2: #22d3ee;
        --error: #ff6b6b;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
          sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 18% 22%, rgba(124, 92, 255, 0.32), transparent 55%),
          radial-gradient(circle at 82% 78%, rgba(34, 211, 238, 0.22), transparent 55%),
          var(--bg);
        background-attachment: fixed;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        padding: 36px 32px 32px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.6);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 22px;
      }
      .brand-logo {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
        box-shadow: 0 8px 22px -10px rgba(124, 92, 255, 0.7);
      }
      .brand-text {
        font-weight: 700;
        letter-spacing: 0.04em;
        font-size: 0.95rem;
      }
      .brand-version {
        margin-left: 8px;
        padding: 2px 8px;
        font-size: 0.7rem;
        background: rgba(124, 92, 255, 0.18);
        color: #c4b9ff;
        border-radius: 999px;
        letter-spacing: 0.06em;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 1.4rem;
        font-weight: 600;
      }
      .sub {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.5;
      }
      form {
        display: grid;
        gap: 14px;
      }
      label {
        display: block;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 6px;
      }
      input[type='password'] {
        width: 100%;
        padding: 12px 14px;
        font-size: 0.95rem;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      input[type='password']:focus {
        border-color: rgba(124, 92, 255, 0.55);
        box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.18);
      }
      button[type='submit'] {
        margin-top: 4px;
        padding: 12px 16px;
        font-size: 0.95rem;
        font-weight: 600;
        color: white;
        background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.12s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      }
      button[type='submit']:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 12px 26px -12px rgba(124, 92, 255, 0.65);
      }
      button[type='submit']:disabled {
        opacity: 0.6;
        cursor: progress;
      }
      .error {
        display: none;
        margin-top: 4px;
        padding: 10px 12px;
        background: rgba(255, 107, 107, 0.1);
        border: 1px solid rgba(255, 107, 107, 0.35);
        border-radius: 8px;
        color: var(--error);
        font-size: 0.85rem;
      }
      .error.show {
        display: block;
      }
      .footer {
        margin-top: 20px;
        font-size: 0.78rem;
        color: var(--muted);
        text-align: center;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="card" role="main" aria-labelledby="title">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true"></div>
        <div>
          <div class="brand-text">GENESIS · Website Builder<span class="brand-version">v2</span></div>
        </div>
      </div>
      <h1 id="title">Restricted access</h1>
      <p class="sub">
        This builder is shared with a small group of partners. Enter the shared password to continue.
      </p>
      <form id="loginForm" autocomplete="off">
        <div>
          <label for="password">Shared password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            autofocus
          />
        </div>
        <div class="error" id="error" role="alert"></div>
        <button type="submit" id="submitBtn">Continue</button>
      </form>
      <div class="footer">Authorized partners only · Sessions persist for 30 days.</div>
    </main>
    <script>
      const form = document.getElementById('loginForm');
      const passwordInput = document.getElementById('password');
      const errorBox = document.getElementById('error');
      const submitBtn = document.getElementById('submitBtn');

      form.addEventListener('submit', async event => {
        event.preventDefault();
        errorBox.classList.remove('show');
        errorBox.textContent = '';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Checking…';
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: passwordInput.value }),
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok && data.success) {
            window.location.replace('/');
            return;
          }
          errorBox.textContent = data.error || 'Sign-in failed. Please try again.';
          errorBox.classList.add('show');
        } catch (err) {
          errorBox.textContent = 'Network error. Please try again.';
          errorBox.classList.add('show');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Continue';
        }
      });
    </script>
  </body>
</html>
